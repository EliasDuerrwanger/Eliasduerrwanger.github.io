<!DOCTYPE html>

  <style>
    /* About page: big round portrait */
    .about {
      grid-template-columns: minmax(0, 360px) minmax(0, 440px);
      align-items: center;
      padding-top: 3rem;
    }
    .about-portrait {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center 30%;  /* move the crop: lower % = more of the top */
      border-radius: 50%;
    }
    @media (max-width: 700px) {
      .about { grid-template-columns: 1fr; justify-items: center; text-align: center; padding-top: 1.5rem; }
      .about-portrait { max-width: 260px; }
    }
  </style>
</head>

  <header class="site-header">

    </nav>

  <main class="about">

    <div class="about-text">

      <p>Mich ziehen stille Landschaften an: von Texas und Kalifornien bis in die Alpen und an die Adria.</p>
